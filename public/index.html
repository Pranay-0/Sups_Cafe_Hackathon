<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUP's Cafe | Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <header class="top">
    <div class="wrap">
      <div class="brand" id="brand"></div>
      <h1 id="title">SUP's Cafe</h1>
      <p id="updated"></p>
    </div>
  </header>

  <main class="wrap" id="menu">
    <p class="note">Loading menu…</p>
  </main>

    <footer class="wrap">
    <span>&copy; Sup's cafe 2026</span>
    <a href="/admin">Admin Login</a>
  </footer>


  <script src="/app.js"></script>
  <script>
    // One photo per section (chosen by the owner in the editor).
    function sectionPhoto(imageId, title) {
      if (!imageId) return null;
      return el('img', {
        class: 'section-photo',
        src: '/api/img/' + imageId,
        alt: title,
        loading: 'lazy',
      });
    }

    // "Flat white ........ R38.00", struck through if sold out / hidden.
    function priceRow(item) {
      const isOut = item.available === false || item.soldOut;
      return el('div', { class: 'row' + (isOut ? ' out-row' : '') },
        el('span', { class: 'name' },
          item.name,
          item.soldOut ? el('span', { class: 'tag out' }, 'Sold out') : null
        ),
        el('span', { class: 'dots' }),
        el('span', { class: 'price' }, money(item.price))
      );
    }

    function description(item) {
      return item.description ? el('p', { class: 'desc' }, item.description) : null;
    }

    // Section = ONE photo first, then the title, optional note and the list of items.
    function menuSection(iconName, title, note, imageId, items, renderItem) {
      if (items.length === 0) return null;
      return el('section', {},
        sectionPhoto(imageId, title),
        el('h2', {}, icon(iconName), title),
        note ? el('p', { class: 'note' }, note) : null,
        el('div', { class: 'items' }, ...items.map(renderItem))
      );
    }

    const renderItem = item => el('div', {}, priceRow(item), description(item));
    const renderSpecial = item => el('div', { class: 'special' }, priceRow(item), description(item));

    function renderMenu(menu) {
      document.getElementById('brand').append(icon('coffee'));
      document.getElementById('title').textContent = menu.cafeName || "SUP's Cafe";

      if (menu.updated) {
        const date = new Date(menu.updated).toLocaleDateString('en-ZA', {
          weekday: 'long', day: 'numeric', month: 'long',
        });
        document.getElementById('updated').textContent = 'Updated ' + date;
      }

      const named = list => (list || []).filter(i => i.name);

      const categorySections = (menu.categories || []).map(category =>
        menuSection('list', category.name, null, category.image, named(category.items), renderItem)
      );

      const sections = [
        menuSection('star', "Today's specials", null, menu.specialsImage, named(menu.specials), renderSpecial),
        menuSection('sun', 'Fresh from the oven', 'Baked today, while stock lasts.', menu.bakesImage, named(menu.bakes), renderItem),
        ...categorySections,
      ].filter(Boolean);

      document.getElementById('menu').replaceChildren(...sections);
    }

    fetch('/api/menu')
      .then(response => response.json())
      .then(renderMenu)
      .catch(() => {
        document.getElementById('menu').replaceChildren(
          el('p', { class: 'note' }, 'The menu could not be loaded. Please refresh.')
        );
      });
  </script>
</body>
</html>
